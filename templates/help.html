{% extends "base.html" %}
{% block body %}
<style>
  .hgroup { margin-top: 6px; }
  .ghead { font-size: 12px; color: #7a8aa0; letter-spacing: 2px; margin: 10px 0 4px;
           border-left: 3px solid rgba(212, 175, 55, .6); padding-left: 8px; }
  .hcmd { display: flex; align-items: baseline; gap: 10px; padding: 4.5px 2px 4.5px 11px;
          border-bottom: 1px dashed rgba(122, 138, 160, .12); }
  .hcmd .c { color: #f0d78c; font-size: 13px; font-weight: 600; min-width: 44%; flex-shrink: 0; }
  .hcmd .d { color: #aab6c5; font-size: 12px; }
</style>
{% for g in groups %}
<div class="hgroup">
  <div class="ghead">{{ g.title }}</div>
  {% for c, d in g.lines %}
  <div class="hcmd"><span class="c">{{ c }}</span><span class="d">{{ d }}</span></div>
  {% endfor %}
</div>
{% endfor %}
{% endblock %}
