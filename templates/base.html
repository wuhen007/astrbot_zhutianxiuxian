<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: transparent; }
  #panel {
    width: 520px;
    background: linear-gradient(160deg, #10151c 0%, #161e29 60%, #1a2230 100%);
    border: 1px solid rgba(212, 175, 55, .35);
    border-radius: 14px;
    padding: 22px 24px;
    color: #d8dee6;
  }
  .title {
    font-size: 19px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, #f0d78c, #d4af37, #f0d78c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid rgba(212, 175, 55, .25);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .title .sub { font-size: 12px; color: #7a8aa0; letter-spacing: 0; font-weight: 400; }
  .row { display: flex; justify-content: space-between; padding: 7px 2px; font-size: 14px; }
  .row .k { color: #7a8aa0; }
  .row .v { color: #e8edf4; font-weight: 600; }
  .row .gold { color: #f0d78c; }
  .row .cyan { color: #6fd3c7; }
  .row .warn { color: #e8a87c; }
  .bar { height: 8px; border-radius: 4px; background: #232b38; overflow: hidden; margin: 6px 0 10px; }
  .bar > div { height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #6fd3c7, #4aa8d8); }
  .bar.gold > div { background: linear-gradient(90deg, #f0d78c, #d4af37); }
  .section { margin-top: 14px; }
  .section .head { font-size: 12px; color: #7a8aa0; letter-spacing: 2px; margin-bottom: 6px; }
  .chip {
    display: inline-block; margin: 3px 6px 3px 0; padding: 4px 10px;
    border-radius: 8px; font-size: 12.5px;
    background: rgba(212, 175, 55, .08); border: 1px solid rgba(212, 175, 55, .25);
    color: #e8d9a0;
  }
  .chip.plain { background: rgba(111, 211, 199, .07); border-color: rgba(111, 211, 199, .3); color: #9adfd6; }
  .footer { margin-top: 16px; font-size: 11px; color: #55637a; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 6px 4px; border-bottom: 1px dashed rgba(122, 138, 160, .15); }
  td.r { text-align: right; color: #e8edf4; font-weight: 600; }
  td.l { color: #c3cdd9; }
  tr.top td { color: #f0d78c; }
  .empty { color: #55637a; font-size: 13px; padding: 8px 0; }
  .vs { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .vs .side { text-align: center; flex: 1; }
  .vs .sname { font-size: 15px; font-weight: 700; color: #f0d78c; }
  .vs .sattr { font-size: 11.5px; color: #8a97ab; margin-top: 3px; }
  .vs .vsmark { font-size: 16px; font-weight: 800; color: #e8a87c; padding: 0 10px; }
  .logbox { background: rgba(0,0,0,.25); border: 1px solid rgba(122,138,160,.15);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .logline { font-size: 12px; color: #aab6c5; line-height: 1.7; }
  .result { font-size: 15px; font-weight: 700; color: #f0d78c; text-align: center; padding: 6px 0; }
  .tag { font-size: 11px; color: #6a7a92; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .cell {
    background: rgba(0,0,0,.22); border: 1px solid rgba(122,138,160,.14);
    border-radius: 8px; padding: 7px 8px; position: relative; min-width: 0;
  }
  .cell .iname { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 26px; }
  .cell .imeta { font-size: 10px; color: #6a7a92; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .iqty { position: absolute; top: 6px; right: 8px; font-size: 12px; font-weight: 800; color: #e8edf4; }
  .textbody { padding: 4px 0; }
  .tline { font-size: 13px; color: #c3cdd9; line-height: 1.85; word-break: break-all; }
  .tline.thead { color: #f0d78c; font-weight: 700; letter-spacing: 1px; padding: 4px 0 2px; }
  .tgap { height: 6px; }
</style>
</head>
<body>
<div id="panel">
  <div class="title">{{ title }}{% if sub %}<span class="sub">{{ sub }}</span>{% endif %}</div>
  {% block body %}{% endblock %}
  <div class="footer">诸天修仙 · {{ footer }}</div>
</div>
</body>
</html>
