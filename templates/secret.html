{% extends "base.html" %}
{% block body %}
<table>
  {% for p in places %}<tr {% if p.open %}class="top"{% endif %}><td class="l">{{ p.name }} {% if p.open %}✅{% else %}🔒{{ p.gate_name }}{% endif %}</td><td class="r">{{ p.desc }}</td></tr>{% endfor %}
</table>
{% if session_note %}<div class="section"><div class="chip plain">{{ session_note }}</div></div>{% endif %}
{% endblock %}
