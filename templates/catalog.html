{% extends "base.html" %}
{% block body %}
<style>
  .cgroup { margin-top: 6px; }
  .chead { font-size: 13px; color: #f0d78c; letter-spacing: 2px; margin: 10px 0 4px;
           border-left: 3px solid rgba(212, 175, 55, .6); padding-left: 8px; }
  .citem { padding: 4.5px 2px 4.5px 11px; border-bottom: 1px dashed rgba(122, 138, 160, .12); }
  .ct { color: #e8edf4; font-size: 12.5px; font-weight: 600; }
  .cd { color: #8a97ab; font-size: 11.5px; margin-top: 1px; }
</style>
{% for g in groups %}
<div class="cgroup">
  <div class="chead">{{ g.group }}</div>
  {% for it in g.list %}
  <div class="citem">
    <div class="ct">{{ it.title }}</div>
    {% if it.desc %}<div class="cd">{{ it.desc }}</div>{% endif %}
  </div>
  {% endfor %}
</div>
{% endfor %}
{% endblock %}
