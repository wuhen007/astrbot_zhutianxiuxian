{% extends "base.html" %}
{% block body %}
<div class="row"><span class="k">仙宠</span><span class="v gold">{{ pet_name }}（{{ grade }}）</span></div>
<div class="row"><span class="k">等级</span><span class="v">{{ level }} / {{ cap }}</span></div>
<div class="row"><span class="k">战绩</span><span class="v">{{ wins }} 胜</span></div>
{% if talent %}<div class="row"><span class="k">天赋</span><span class="v warn">{{ talent }}</span></div>{% endif %}
<div class="row"><span class="k">主人加成</span><span class="v cyan">三维 +{{ bonus_pct }}%</span></div>
{% if desc %}<div class="section"><div class="head">图鉴</div><div style="font-size:12.5px;color:#8a97ab;line-height:1.6">{{ desc }}</div></div>{% endif %}
{% endblock %}
